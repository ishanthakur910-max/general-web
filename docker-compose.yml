services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: inventorydb
      DB_USER: inventoryuser
      DB_PASSWORD: inventorypass123

    depends_on:
      - db


  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: inventorydb
      POSTGRES_USER: inventoryuser
      POSTGRES_PASSWORD: inventorypass123
    volumes:
      - post-data:/var/lib/postgresql/data

volumes:
  post-data:
